name: SocialSign.in
description: >-
  SocialSign.in is a guest WiFi marketing platform that turns venue Wi-Fi
  login into a customer-acquisition and engagement channel. When guests connect to
  free Wi-Fi through branded splash pages, the platform captures opt-in contact data
  (email, phone, profile), measures visit frequency and dwell time, and syncs profiles
  to CRM and email/SMS marketing tools to trigger targeted campaigns across retail,
  hospitality, sports and entertainment, healthcare, and commercial real estate venues.
  It sells two products: the enterprise platform, sold through a contact-sales motion,
  and SocialSign.in Go, a self-serve packaged version with published per-location pricing.
  The company publishes no developer portal, no API reference, and no machine-readable
  specification of any kind; its product documentation lives in a public Zendesk help
  center covering portal setup and CRM/ESP connector configuration rather than any
  programmable interface. A JSON-emitting API root does exist at c.socialsign.in/api/
  inside the authenticated customer console, and the Enterprise tier advertises
  "Advanced integrations" and a "Data mart", but neither is documented publicly.
