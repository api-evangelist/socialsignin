description: >-
  No rate limits are published anywhere on the SocialSign.in public surface.
  This is an honest zero, not an unchecked field: the full page sitemap was
  walked (26 pages, no developer or reference page among them), the Zendesk
  help center was searched via its public Help Center search API for "API",
  "api key", "webhook", "developer", "integration" and "export", and none of
  the returned articles document an API contract, quota, or throttle. The only
  reachable API surface — https://c.socialsign.in/api/ — returns a bare
  placeholder body and emits no RateLimit-*, X-RateLimit-* or Retry-After
  headers on an unauthenticated request.
